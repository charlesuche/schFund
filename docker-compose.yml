# PostgreSQL with the pgvector extension, for later phases.
# Start: docker compose up -d    Stop: docker compose down
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: scholar
      POSTGRES_DB: scholarships
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
